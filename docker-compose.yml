services:
  mongodb:
    container_name: mongodb-comunicacao-escolar
    image: mongo:8
    volumes:
      - vol-mongodb:/data/db
    command: mongod --quiet --logpath /dev/null
    ports:
      - '27017:27017'
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/comunicacao-escolar --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  minio:
    image: minio/minio:latest
    container_name: minio-comunicacao-escolar
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    ports:
      - '${MINIO_PORT}:${MINIO_PORT}'
      - '${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}'
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:${MINIO_CONSOLE_PORT}
    volumes:
      - ./minio-data:/data
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-f',
          'http://localhost:${MINIO_PORT}/minio/health/live',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: comunicacao-escolar-api
    image: arthurhlmg/comunicacao-escolar-api:latest
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always

volumes:
  vol-mongodb:
  vol-minio:
